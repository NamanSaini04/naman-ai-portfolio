 <radialGradient id="halo"><stop stop-color="#64c6ff" stop-opacity=".28"/><stop offset="1" stop-color="#64c6ff" stop-opacity="0"/></radialGradient>
 <radialGradient id="warmhalo"><stop stop-color="#ff8664" stop-opacity=".28"/><stop offset="1" stop-color="#ff8664" stop-opacity="0"/></radialGradient>
